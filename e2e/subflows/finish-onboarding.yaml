# Shared steps: a fresh install goes through onboarding (O1–O10f) and lands on the Review tab.
# Used with runFlow. Not run alone (scripts/e2e.sh only runs e2e/flows).
appId: com.comebackhamid.lockwords
---
# O0 Hello: Kai says welcome
- extendedWaitUntil:
    visible: "I.m Kai, welcome to Lockwords"
    timeout: 15000
- tapOn: "Start"
# O1 I'm learning
- assertVisible: "What do you want to learn?"
- tapOn: "Spanish"
- tapOn: "Continue"
# O1c I speak
- assertVisible: "What language do you speak?"
- tapOn: "English"
- tapOn: "Continue"
# O2 Welcome
- assertVisible: "Learn a word every time you unlock."
- tapOn: "Get started"
# O3 Level
- assertVisible: "Your Spanish level"
- tapOn: "Some basics"
- tapOn: "Continue"
# O4–O7 Word test (docs/vocab-engine.md): 5 basic words + 1 intermediate word → no advanced page → ≈ 150, A1
- assertVisible: "BASIC WORDS"
- tapOn: "la casa"
- tapOn: "la noche"
- tapOn: "comer"
- tapOn: "la familia"
- tapOn: "la mano"
- assertVisible: "5 SELECTED"
- runFlow: next-page.yaml
- assertVisible: "INTERMEDIATE WORDS"
- tapOn: "el reloj"
- runFlow: next-page.yaml
- extendedWaitUntil:
    visible: "YOU ALREADY KNOW"
    timeout: 15000
- assertVisible: "About level A1"
- extendedWaitUntil:
    visible: "150"
    timeout: 5000
- tapOn: "Continue"
# O8–O10f: goal, interests, the Kai chat and the first deck (shared steps)
- runFlow: goal-to-first-deck.yaml
