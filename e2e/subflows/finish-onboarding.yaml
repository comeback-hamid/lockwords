# Shared steps: a fresh install goes through onboarding (O1–O10f) and lands on the Review tab.
# Used with runFlow. Not run alone (scripts/e2e.sh only runs e2e/flows).
appId: com.comebackhamid.lockwords
---
# O1 I'm learning
- assertVisible: "What do you want to learn?"
- tapOn: "Spanish"
- tapOn: "Continue"
# O1c I speak
- assertVisible: "What language do you speak?"
- tapOn: "English"
- tapOn: "Continue"
# O2 Welcome
- assertVisible: "Learn a word every time you unlock."
- tapOn: "Get started"
# O3 Level
- assertVisible: "Your Spanish level"
- tapOn: "Some basics"
- tapOn: "Continue"
# O4–O7 Word test (docs/vocab-engine.md): 5 basic words + 1 intermediate word → no advanced page → ≈ 150, A1
- assertVisible: "BASIC WORDS"
- tapOn: "la casa"
- tapOn: "la noche"
- tapOn: "comer"
- tapOn: "la familia"
- tapOn: "la mano"
- assertVisible: "5 SELECTED"
- runFlow: next-page.yaml
- assertVisible: "INTERMEDIATE WORDS"
- tapOn: "el reloj"
- runFlow: next-page.yaml
- extendedWaitUntil:
    visible: "YOU ALREADY KNOW"
    timeout: 15000
- assertVisible: "About level A1"
- extendedWaitUntil:
    visible: "150"
    timeout: 5000
- tapOn: "Continue"
# O8 Goal
- assertVisible: "Why are you learning?"
- tapOn: "Travel"
- tapOn: "Continue"
# O9 Interests
- assertVisible: "What are you into?"
- tapOn: "Food"
- tapOn: "Music"
- assertVisible: "2 SELECTED"
- tapOn: "Continue"
# O10 Kai asks the name
- extendedWaitUntil:
    visible: ".*What’s your name.*"
    timeout: 20000
- tapOn: "Message"
- inputText: "Maya"
- tapOn: "Send"
# O10b chat language
- assertVisible: ".*Nice to meet you, Maya.*"
- tapOn: "English"
# O10c what Kai does, pick your words
- extendedWaitUntil:
    visible: "Ordering food"
    timeout: 20000
- tapOn: "Ordering food"
# O10d deck card
- extendedWaitUntil:
    visible: "Generate"
    timeout: 20000
# The Generate button cannot be tapped while Kai still types the line under the card. Wait for that line, then tap.
- extendedWaitUntil:
    visible: ".*Tap Generate.*"
    timeout: 20000
- tapOn: "Generate"
# O10e → O10f deck ready
- extendedWaitUntil:
    visible: ".*Shall we practice them now.*"
    timeout: 60000
- assertVisible: "Open deck"
- tapOn: "OK, let’s practice!"
