# Needs the local stack: `npm run dev:up` (Supabase + server). Dev build only (the user id line shows in dev builds).
appId: ai.dailydoses.lockwords
tags:
  - onboarding
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: guest-login
# A fresh install starts in onboarding. Go through it to reach the tabs.
- runFlow: ../subflows/finish-onboarding.yaml
# Silent guest sign-in: no login screen, and the server knows us.
- extendedWaitUntil:
    visible:
      id: "dev-user-id"
    timeout: 20000
- copyTextFrom:
    id: "dev-user-id"
- stopApp
- launchApp
# Same user after a restart, on every tab.
- extendedWaitUntil:
    visible: ${maestro.copiedText}
    timeout: 20000
- assertVisible: "New words"
- tapOn: "Progress"
- assertVisible: ${maestro.copiedText}
- tapOn: "Review"
- assertVisible: ${maestro.copiedText}
- stopRecording
