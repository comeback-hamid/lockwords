# Needs the local stack: `npm run dev:up`. Dev build only (the user id line shows in dev builds).
appId: com.comebackhamid.lockwords
tags:
  - onboarding
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: onboarding
# O1–O10f: onboarding up to the first deck (shared steps)
- runFlow: ../subflows/finish-onboarding.yaml
# Onboarding finished → Review tab, and the server knows this guest
- extendedWaitUntil:
    visible:
      id: "dev-user-id"
    timeout: 20000
- assertVisible: "Review"
- copyTextFrom:
    id: "dev-user-id"
# Restart: straight to the tabs, same user
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ${maestro.copiedText}
    timeout: 20000
- assertVisible: "New words"
- stopRecording
