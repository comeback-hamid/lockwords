# The whole first run: onboarding → first deck → first review round → Use it → hard words → trial → paywall → tabs.
# Needs the local stack: `npm run dev:up`. Dev build.
appId: ai.dailydoses.lockwords
tags:
  - review
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: first-run
# O1–O10f: onboarding up to the first deck (shared steps)
- runFlow: ../subflows/finish-onboarding.yaml
# Review tab: the start of the first round
- extendedWaitUntil:
    visible: "10 cards due today"
    timeout: 20000
- tapOn: "Let’s start"
- assertVisible: "10 words left"
- assertVisible: "la cuenta"
- assertVisible: "TAP TO FLIP"
# Flip the card
- tapOn:
    id: "review-card"
- assertVisible: "the bill"
# Use it
- tapOn: "Use it"
- assertVisible: ".*Write one sentence with la cuenta.*"
- tapOn: "Message.*"
- inputText: "Quiero la cuenta, por favor."
- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*Great sentence.*"
    timeout: 20000
- assertVisible: "LA CUENTA MOVED UP A LEVEL"
- tapOn: "Next card"
- extendedWaitUntil:
    visible: "9 words left"
    timeout: 15000
- assertVisible: "la propina"
# Hard: swipe left. The hard word does not come back in the same round (Hamid, 2026-11-24).
- swipe:
    start: "50%, 50%"
    end: "5%, 50%"
- extendedWaitUntil:
    visible: "pedir"
    timeout: 15000
- assertVisible: "8 words left"
# I know it: tap
- tapOn: "Know it"
- extendedWaitUntil:
    visible: "7 words left"
    timeout: 15000
# Easy: swipe right
- swipe:
    start: "50%, 50%"
    end: "95%, 50%"
- extendedWaitUntil:
    visible: "6 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "5 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "4 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "3 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "2 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "1 word left"
    timeout: 15000
- tapOn: "Easy"
# One-time screens after the first round
- extendedWaitUntil:
    visible: "Hard words go to your lock screen"
    timeout: 15000
- assertVisible: "YOUR HARD WORDS · 1"
- assertVisible: "the tip"
- tapOn: "Continue"
- assertVisible: "We’ll remind you before your trial ends"
- tapOn: "Continue"
- assertVisible: "Keep your words growing"
- tapOn: "Monthly"
- tapOn: "Yearly"
- tapOn: "Close"
# In the app
- assertVisible: "New words"
- tapOn: "Review"
- extendedWaitUntil:
    visible: "All cards done"
    timeout: 15000
# Restart: still in the app, nothing to review
- stopApp
- launchApp
- assertVisible: "New words"
- stopRecording
