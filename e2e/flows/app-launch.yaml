# Smoke test: a fresh install opens on the first onboarding screen, and stays there after a restart.
appId: com.comebackhamid.lockwords
tags:
  - platform
---
- launchApp:
    clearState: true
    clearKeychain: true
- assertVisible: "What do you want to learn?"
# The tabs are closed until onboarding is finished.
- assertNotVisible: "New words"
- stopApp
- launchApp
- assertVisible: "What do you want to learn?"
