# Smoke test: a fresh install opens on O0 Hello (Kai says welcome), Start opens the first question,
# and a restart before onboarding is finished opens Hello again.
appId: ai.dailydoses.lockwords
tags:
  - platform
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: "I.m Kai, welcome to Lockwords"
    timeout: 15000
- tapOn: "Start"
- assertVisible: "What do you want to learn?"
# The tabs are closed until onboarding is finished.
- assertNotVisible: "New words"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "I.m Kai, welcome to Lockwords"
    timeout: 15000
