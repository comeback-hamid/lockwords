# O8 Goal (Other with a reason) and O9 Interests (20 tiles, 1 to 5 picked). Figma O8b, O9b.
# Needs the local stack (Supabase login + server). Dev build only.
appId: com.dailydoses.lockwords
tags:
  - onboarding
---
- launchApp:
    clearState: true
    clearKeychain: true
# O1–O3, then "Brand new" skips the word test (O4–O7 have their own flows: word-test-*.yaml)
- runFlow: ../subflows/to-level.yaml
- tapOn: "Brand new"
- tapOn: "Continue"
- startRecording: onboarding-goal-interests
# O8 Goal: Other opens the "Your reason" box; Continue waits for text
- assertVisible: "Why are you learning?"
- tapOn: "Other"
- assertVisible: "YOUR REASON"
- inputText: "For my grandmother"
- assertVisible: "For my grandmother"
# A tap outside the box closes the keyboard
- tapOn: "YOUR REASON"
- tapOn: "Work"
- assertNotVisible: "YOUR REASON"
# Back to Other: the reason typed before is still there
- tapOn: "Other"
- assertVisible: "For my grandmother"
- tapOn: "Continue"
# O9 Interests: 20 tiles, none of the dropped ones
- assertVisible: "What are you into?"
- assertNotVisible: "Cooking"
- assertNotVisible: "Fashion"
- tapOn: "Food"
- tapOn: "Travel"
- tapOn: "Music"
- tapOn: "Movies"
- assertVisible: "4 SELECTED"
- tapOn: "Books"
# Five picked: the rest fade and cannot be picked
- assertVisible: "5 OF 5 PICKED"
- assertVisible:
    text: "Work"
    enabled: false
- tapOn: "Work"
- assertVisible: "5 OF 5 PICKED"
# Unpick one: the rest come back
- tapOn: "Books"
- assertVisible: "4 SELECTED"
- tapOn: "Work"
- assertVisible: "5 OF 5 PICKED"
- scrollUntilVisible:
    element: "Culture"
    direction: DOWN
- assertVisible:
    text: "Culture"
    enabled: false
- tapOn: "Continue"
# Saved: the Kai chat starts
- extendedWaitUntil:
    visible: ".*What’s your name.*"
    timeout: 20000
- stopRecording
