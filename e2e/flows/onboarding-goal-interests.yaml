# O8 Goal (Other with a reason) and O9 Interests (20 tiles, 1 to 5 picked). Figma O8b, O9b.
# Needs the local stack (Supabase login + server). Dev build only.
appId: com.comebackhamid.lockwords
tags:
  - onboarding
---
- launchApp:
    clearState: true
    clearKeychain: true
# O1 I'm learning
- assertVisible: "What do you want to learn?"
- tapOn: "Spanish"
- tapOn: "Continue"
# O1c I speak
- assertVisible: "What language do you speak?"
- tapOn: "English"
- tapOn: "Continue"
# O2 Welcome
- assertVisible: "Learn a word every time you unlock."
- tapOn: "Get started"
# O3 Level
- assertVisible: "Your Spanish level"
- tapOn: "Some basics"
- tapOn: "Continue"
# O4–O6 Word test
- assertVisible: "BASIC · 1 OF 3"
- tapOn: "hola"
- tapOn: "gracias"
- tapOn: "la casa"
- assertVisible: "3 SELECTED"
- tapOn: "Continue"
- assertVisible: "INTERMEDIATE · 2 OF 3"
- tapOn: "aunque"
- tapOn: "Continue"
- assertVisible: "ADVANCED · 3 OF 3"
- tapOn: "I don’t know any of these"
# O7 Your estimate: 3 of 22 basic + 1 of 21 intermediate ≈ 250 words
- assertVisible: "YOU ALREADY KNOW"
- assertVisible: "250"
- assertVisible: "A1"
- tapOn: "Continue"
- startRecording: onboarding-goal-interests
# O8 Goal: Other opens the "Your reason" box; Continue waits for text
- assertVisible: "Why are you learning?"
- tapOn: "Other"
- assertVisible: "YOUR REASON"
- inputText: "For my grandmother"
- assertVisible: "For my grandmother"
# A tap outside the box closes the keyboard
- tapOn: "YOUR REASON"
- tapOn: "Work"
- assertNotVisible: "YOUR REASON"
# Back to Other: the reason typed before is still there
- tapOn: "Other"
- assertVisible: "For my grandmother"
- tapOn: "Continue"
# O9 Interests: 20 tiles, none of the dropped ones
- assertVisible: "What are you into?"
- assertNotVisible: "Cooking"
- assertNotVisible: "Fashion"
- tapOn: "Food"
- tapOn: "Travel"
- tapOn: "Music"
- tapOn: "Movies"
- assertVisible: "4 SELECTED"
- tapOn: "Books"
# Five picked: the rest fade and cannot be picked
- assertVisible: "5 OF 5 PICKED"
- assertVisible:
    text: "Work"
    enabled: false
- tapOn: "Work"
- assertVisible: "5 OF 5 PICKED"
# Unpick one: the rest come back
- tapOn: "Books"
- assertVisible: "4 SELECTED"
- tapOn: "Work"
- assertVisible: "5 OF 5 PICKED"
- scrollUntilVisible:
    element: "Culture"
    direction: DOWN
- assertVisible:
    text: "Culture"
    enabled: false
- tapOn: "Continue"
# Saved: the Kai chat starts
- extendedWaitUntil:
    visible: ".*What’s your name.*"
    timeout: 20000
- stopRecording
