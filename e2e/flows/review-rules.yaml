# The review rules a learner can see: Easy on a new word comes back in 3 days, and a Hard word comes back at the end of the round.
# Needs the local stack: `npm run dev:up`. Dev build.
appId: ai.dailydoses.lockwords
tags:
  - review
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: review-srs-rules
- runFlow: ../subflows/finish-onboarding.yaml
- extendedWaitUntil:
    visible: "10 cards due today"
    timeout: 20000
- tapOn: "Let’s start"
- assertVisible: "10 words left"
- assertVisible: "la cuenta"
# Hard on the first word: it is done for today (it does not come back in the same round)
- tapOn: "Hard"
- extendedWaitUntil:
    visible: "la propina"
    timeout: 15000
- assertVisible: "9 words left"
# Easy on a new word (back in 3 days: the label is on the card as it leaves, too short for a flow to read;
# its text is checked in apps/mobile/__tests__/review-card.test.tsx and the rule in the server tests)
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "8 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "7 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "6 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "5 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "4 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "3 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "2 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "1 word left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "Hard words go to your lock screen"
    timeout: 15000
# Still hard: it stays on the lock screen until level 3
- assertVisible: "YOUR HARD WORDS · 1"
- assertVisible: "la cuenta"
- stopRecording
