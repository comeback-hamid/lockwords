# The app side of the lock screen widget: O14 shows the widget look, and the address a widget tap opens
# (lockwords://review?first=<id>) starts Review on that hard word. Maestro cannot tap a widget on the lock screen,
# so the flow reads the address from a dev-only line on the Review tab.
# Needs the local stack: `npm run dev:up`. Dev build with the widget (expo-widgets).
appId: com.comebackhamid.lockwords
tags:
  - widget
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: lock-widgets
- runFlow: ../subflows/finish-onboarding.yaml
- extendedWaitUntil:
    visible: "10 cards due today"
    timeout: 20000
- tapOn: "Let’s start"
- assertVisible: "la cuenta"
# One hard word, the rest easy
- tapOn: "Hard"
- extendedWaitUntil:
    visible: "9 words left"
    timeout: 15000
- repeat:
    times: 9
    commands:
      - tapOn: "Easy"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Hard words go to your lock screen"
    timeout: 15000
# O14: the phone shows the widget as it really looks, and how to add it
- assertVisible:
    id: "lock-widget"
- assertVisible: "Look 1 of 5"
- assertVisible: "Hold your lock screen, tap Customize, then add Lockwords."
- assertVisible: "YOUR HARD WORDS · 1"
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "Close"
- tapOn: "Review"
- extendedWaitUntil:
    visible: "All cards done"
    timeout: 15000
# The widget now shows the hard word. A tap on it opens this address.
- extendedWaitUntil:
    visible:
      id: "dev-widget-url"
    timeout: 15000
- copyTextFrom:
    id: "dev-widget-url"
- openLink: ${maestro.copiedText}
# The simulator asks before it opens the app from an address. A real widget tap does not ask.
- tapOn:
    text: "Open"
    optional: true
# Review opens inside the round on that word. It was swiped today, so it is a look card: Next, no swipes.
- extendedWaitUntil:
    visible: "1 word left"
    timeout: 15000
- assertVisible: "la cuenta"
- assertVisible: "NEXT"
- assertNotVisible: "EASY"
- tapOn: "la cuenta"
- assertVisible: "the bill"
- tapOn: "Next"
- extendedWaitUntil:
    visible: "All cards done"
    timeout: 15000
- stopRecording
