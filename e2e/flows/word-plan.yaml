# The word plan on the Progress tab: three next decks; a tap asks Kai for that deck in the New words chat.
# Needs the local stack: `npm run dev:up`. Dev build. The stand-in plan is fixed.
appId: com.comebackhamid.lockwords
tags:
  - my-words
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: word-plan
- runFlow: ../subflows/finish-onboarding.yaml
- extendedWaitUntil:
    visible: "10 cards to review today"
    timeout: 20000
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "words in your word bank"
    timeout: 15000
- scrollUntilVisible:
    element: "YOUR WORD PLAN · TRAVEL"
    direction: DOWN
    timeout: 30000
# The deck the learner has ("Ordering food") is not in the plan
- scrollUntilVisible:
    element: "At the hotel, 10 words · words \\+ phrases"
    direction: DOWN
- assertVisible: "Getting around the city, 30 words · words \\+ phrases"
- assertVisible: "Meeting new people, 20 words · words \\+ phrases"
- assertNotVisible: "Ordering food.*"
# A tap opens the New words chat and asks Kai for that deck
- tapOn: "Getting around the city, 30 words · words \\+ phrases"
- extendedWaitUntil:
    visible: "You: A deck about Getting around the city"
    timeout: 40000
- extendedWaitUntil:
    visible: "Generate"
    timeout: 60000
- stopRecording
