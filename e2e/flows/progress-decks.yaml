# Progress: the total, the decks at the bottom of the page, the deck words page with filters (P3), Restore, and
# "Review this deck".
# Needs the local stack: `npm run dev:up`. Dev build.
appId: com.comebackhamid.lockwords
tags:
  - my-words
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: progress-decks
- runFlow: ../subflows/finish-onboarding.yaml
- extendedWaitUntil:
    visible: "10 cards to review today"
    timeout: 20000
# The first round: one Hard, one "I know it", the rest Easy
- tapOn: "Let’s start"
- assertVisible: "la cuenta"
- tapOn: "Hard"
- extendedWaitUntil:
    visible: "la propina"
    timeout: 15000
- tapOn: "Know it"
- extendedWaitUntil:
    visible: "9 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "8 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "7 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "6 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "5 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "4 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "3 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "2 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "1 word left"
    timeout: 15000
- assertVisible: "la cuenta"
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "Hard words go to your lock screen"
    timeout: 15000
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "Close"
# Progress tab: the total, the hard word, and the decks at the bottom of the page
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "words in your word bank"
    timeout: 15000
- assertVisible: "10"
- assertVisible: "1 hard word"
- scrollUntilVisible:
    element: "You have 1 deck"
    direction: DOWN
- scrollUntilVisible:
    element: "Open deck.*"
    direction: DOWN
    centerElement: true
- tapOn: "Open deck.*"
# P3 Deck words: counts, chips, the known word only under Known
- extendedWaitUntil:
    visible: "A1 · 9 WORDS"
    timeout: 15000
- assertVisible: "9 LEARNING · 1 HARD"
- assertVisible: "All 9"
- assertVisible: "la cuenta, the bill, hard word"
- assertNotVisible: "la propina, the tip"
- tapOn: "Hard 1"
- assertVisible: "la cuenta, the bill, hard word"
- assertNotVisible: "pedir, to order"
# Restore the "I know it" word
- tapOn: "Known 1"
- assertVisible: "la propina, the tip"
- tapOn: "Restore la propina"
- extendedWaitUntil:
    visible: "All 10"
    timeout: 15000
- assertNotVisible: "Known 1"
# Review this deck: only the restored word is left today; this round has a Close button
- tapOn: "Review this deck"
- extendedWaitUntil:
    visible: "1 word left"
    timeout: 15000
- assertVisible: "la propina"
- tapOn: "Close"
- extendedWaitUntil:
    visible: "All 10"
    timeout: 15000
- stopRecording
