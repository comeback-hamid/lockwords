# Progress home (P1), top to bottom: the numbers, the meadow, the goal grid, the big meadow, and the
# decks as short rows. No hard words on this page (Hamid, 2026-11-23). After the first round the numbers move.
# Needs the local stack: `npm run dev:up`. Dev build.
appId: com.comebackhamid.lockwords
tags:
  - my-words
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: progress-home
- runFlow: ../subflows/finish-onboarding.yaml
- extendedWaitUntil:
    visible: "10 cards due today"
    timeout: 20000
# Before any review: 10 new words, one small tree (no Kai in the meadow since 2026-11-25)
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "words in your word bank"
    timeout: 15000
- assertVisible: "10 new"
- assertVisible: "0 learning"
- assertVisible: "0 mastered"
- assertNotVisible: ".*hard word.*"
- assertVisible: "Your meadow now: 1 tree"
# The link to a separate decks page and the word plan are gone
- assertNotVisible: "1 Deck"
- scrollUntilVisible:
    element: "10 of 100 words"
    direction: DOWN
# The time switch (2026-11-25): In 3 months shows the same page as it will be, then back to Today
- scrollUntilVisible:
    element: "In 3 months"
    direction: UP
- tapOn: "In 3 months.*"
- assertVisible: "ABOUT, AT YOUR PACE"
- assertVisible: "Your meadow in 3 months: .* trees"
- waitForAnimationToEnd:
    timeout: 6000
- tapOn: "Today.*"
- assertVisible: "Your meadow now: 1 tree"
# The decks live at the bottom of the page
- scrollUntilVisible:
    element: "You have 1 deck"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element: "Ordering food, 10 words · all new"
    direction: DOWN
- assertNotVisible: "YOUR WORD PLAN.*"
# The first round: the first word Hard, the rest Easy
- tapOn: "Review"
- tapOn: "Let’s start"
- assertVisible: "10 words left"
- assertVisible: "la cuenta"
- tapOn: "Hard"
- extendedWaitUntil:
    visible: "la propina"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "8 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "7 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "6 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "5 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "4 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "3 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "2 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "1 word left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "Hard words go to your lock screen"
    timeout: 15000
- assertVisible: "YOUR HARD WORDS · 1"
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "Close"
# After the round the numbers moved
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "10 learning"
    timeout: 15000
- assertVisible: "0 new"
- assertNotVisible: ".*hard word.*"
- scrollUntilVisible:
    element: "Ordering food, 10 words · 10 learning"
    direction: DOWN
    timeout: 60000
- stopRecording
