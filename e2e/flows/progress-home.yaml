# Progress home (P1), top to bottom: the numbers with the hard words, the small meadow with Kai, the goal grid, the
# big meadow, and the decks. Then one Hard swipe: the hard words number and the hard words list show it.
# Needs the local stack: `npm run dev:up`. Dev build.
appId: com.comebackhamid.lockwords
tags:
  - my-words
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: progress-home
- runFlow: ../subflows/finish-onboarding.yaml
- extendedWaitUntil:
    visible: "10 cards to review today"
    timeout: 20000
# Before any review: 10 new words, no hard word, one small tree with Kai next to it
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "words in your word bank"
    timeout: 15000
- assertVisible: "10 new"
- assertVisible: "0 learning"
- assertVisible: "0 mastered"
- assertVisible: "0 hard words"
- assertVisible: "Your meadow now: 1 tree"
- assertVisible: "Kai"
# The link to a separate decks page and the word plan are gone
- assertNotVisible: "1 Deck"
- scrollUntilVisible:
    element: "10 of 100 words"
    direction: DOWN
- scrollUntilVisible:
    element: "you’ll master"
    direction: DOWN
- assertVisible: "BY .*"
- scrollUntilVisible:
    element: "new Spanish words"
    direction: DOWN
# The big meadow: three big trees that move in the wind
- scrollUntilVisible:
    element: "Your meadow at the goal: 3 trees"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 6000
# The decks live at the bottom of the page
- scrollUntilVisible:
    element: "You have 1 deck"
    direction: DOWN
    timeout: 60000
- scrollUntilVisible:
    element: "Open deck.*"
    direction: DOWN
- assertNotVisible: "YOUR WORD PLAN.*"
# The first round: the first word Hard, the rest Easy; the hard word comes back once
- tapOn: "Review"
- tapOn: "Let’s start"
- assertVisible: "10 words left"
- assertVisible: "la cuenta"
- tapOn: "Hard"
- extendedWaitUntil:
    visible: "la propina"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "9 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "8 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "7 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "6 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "5 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "4 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "3 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "2 words left"
    timeout: 15000
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "1 word left"
    timeout: 15000
- assertVisible: "la cuenta"
- tapOn: "Easy"
- extendedWaitUntil:
    visible: "Hard words go to your lock screen"
    timeout: 15000
- assertVisible: "YOUR HARD WORDS · 1"
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "Close"
# After the round the numbers moved, and the hard word is counted
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "10 learning"
    timeout: 15000
- assertVisible: "0 new"
- assertVisible: "1 hard word"
# The hard words list
- tapOn: "1 hard word"
- extendedWaitUntil:
    visible: "Hard words"
    timeout: 15000
- assertVisible: "1 WORD · ON YOUR LOCK SCREEN"
- assertVisible: "la cuenta, the bill"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "words in your word bank"
    timeout: 15000
- stopRecording
