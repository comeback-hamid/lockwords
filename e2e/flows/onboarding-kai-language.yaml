# Kai's lines by language: a Persian speaker who learns Spanish. The app loads Kai's script from the server before the
# chat starts, and again follows the picked chat language. The stand-in translator returns the English lines, so the
# texts here are English; the steps and the server call are the real ones. (Other languages: see the screen tests.)
# Needs the local stack: `npm run dev:up`. Dev build.
appId: com.dailydoses.lockwords
tags:
  - onboarding
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: onboarding-kai-language
# O0 Hello: Kai says welcome
- extendedWaitUntil:
    visible: "I.m Kai, welcome to Lockwords"
    timeout: 15000
- tapOn: "Start"
- assertVisible: "What do you want to learn?"
- tapOn: "Spanish"
- tapOn: "Continue"
- assertVisible: "What language do you speak?"
- tapOn: "Persian"
- tapOn: "Continue"
- assertVisible: "Learn a word every time you unlock."
- tapOn: "Get started"
- assertVisible: "Your Spanish level"
- tapOn: "Brand new"
- tapOn: "Continue"
- assertVisible: "Why are you learning?"
- tapOn: "Travel"
- tapOn: "Continue"
- assertVisible: "What are you into?"
- tapOn: "Food"
- tapOn: "Continue"
# O10: the chat starts after the script is loaded
- extendedWaitUntil:
    visible: ".*What’s your name.*"
    timeout: 20000
- tapOn: "Message.*"
- inputText: "Sara"
- tapOn: "Send"
# O10b: both languages under their own names; pick the learned one
- extendedWaitUntil:
    visible: "فارسی"
    timeout: 20000
- assertVisible: ".*Nice to meet you, Sara.*"
- tapOn: "Español"
# O10c: Kai goes on, and the deck ideas come as tap answers
- extendedWaitUntil:
    visible: "Ordering food"
    timeout: 30000
- assertVisible: ".*Let’s start with 10 new words.*"
- tapOn: "Ordering food"
- extendedWaitUntil:
    visible: ".*Tap Generate.*"
    timeout: 20000
- tapOn: "Generate"
- extendedWaitUntil:
    visible: ".*Shall we practice them now.*"
    timeout: 60000
- tapOn: "OK, let’s practice!"
- extendedWaitUntil:
    visible: "10 cards due today"
    timeout: 20000
- stopRecording
