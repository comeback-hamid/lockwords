# Kai chat live (kai-chat-live): Kai types with dots, answers a question off the script and asks again,
# reads a name in a sentence, a tapped option rises into the chat, then the deck is made.
# Needs the local stack (server without an AI key uses the fixture Kai reply). Dev build only.
appId: com.comebackhamid.lockwords
tags:
  - kai
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: kai-chat-live
# O0 Hello: Kai says welcome
- extendedWaitUntil:
    visible: "I.m Kai, welcome to Lockwords"
    timeout: 15000
- tapOn: "Start"
# O1 I'm learning
- assertVisible: "What do you want to learn?"
- tapOn: "Spanish"
- tapOn: "Continue"
# O1c I speak
- assertVisible: "What language do you speak?"
- tapOn: "English"
- tapOn: "Continue"
# O2 Welcome
- assertVisible: "Learn a word every time you unlock."
- tapOn: "Get started"
# O3 Level
- assertVisible: "Your Spanish level"
- tapOn: "Some basics"
- tapOn: "Continue"
# O4–O7 Word test (docs/vocab-engine.md): 5 basic words + 1 intermediate word → no advanced page → ≈ 150, A1
- assertVisible: "BASIC WORDS"
- tapOn: "la casa"
- tapOn: "la noche"
- tapOn: "comer"
- tapOn: "la familia"
- tapOn: "la mano"
- assertVisible: "5 SELECTED"
- runFlow: ../subflows/next-page.yaml
- assertVisible: "INTERMEDIATE WORDS"
- tapOn: "el reloj"
- runFlow: ../subflows/next-page.yaml
- extendedWaitUntil:
    visible: "YOU ALREADY KNOW"
    timeout: 15000
- assertVisible: "About level A1"
- extendedWaitUntil:
    visible: "150"
    timeout: 5000
- tapOn: "Continue"
# O8 Goal
- assertVisible: "Why are you learning?"
- tapOn: "Travel"
- tapOn: "Continue"
# O9 Interests
- assertVisible: "What are you into?"
- tapOn: "Food"
- tapOn: "Music"
- assertVisible: "2 SELECTED"
- tapOn: "Continue"
# O10: Kai types (dots), then asks the name
- extendedWaitUntil:
    visible: ".*What’s your name.*"
    timeout: 20000
# A question instead of a name: Kai answers, then asks again
- tapOn: "Message.*"
- inputText: "Why do you need my name?"
- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*greet you.*"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*So, what’s your name.*"
    timeout: 20000
# A name in a sentence
- tapOn: "Message.*"
- inputText: "I'm Maya"
- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*Nice to meet you, Maya.*"
    timeout: 20000
# A tapped option rises into the chat
- extendedWaitUntil:
    visible: "English"
    timeout: 20000
- tapOn: "English"
- extendedWaitUntil:
    visible: "Ordering food"
    timeout: 30000
- tapOn: "Ordering food"
- extendedWaitUntil:
    visible: "Generate"
    timeout: 20000
- tapOn: "Generate"
# Kai is making. With the local stand-in AI the deck is ready at once, so the count shows only for a moment
# (its timing is tested in __tests__/kai-chat-live.test.tsx).
- extendedWaitUntil:
    visible: ".*Shall we practice them now.*"
    timeout: 60000
- assertVisible: "Open deck"
- stopRecording
