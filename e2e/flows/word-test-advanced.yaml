# Word test, situation 3: an advanced learner. All four pages: 15+ advanced words open the EXPERT page.
# All of A and B, 16 of C, 8 of D → ≈ 4,600, C1 (checked with the engine). Needs the local stack: `npm run dev:up`.
appId: com.comebackhamid.lockwords
tags:
  - onboarding
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: word-test-advanced
- runFlow: ../subflows/to-level.yaml
- tapOn: "Advanced"
- tapOn: "Continue"
- assertVisible: "BASIC WORDS"
- tapOn: "la casa"
- tapOn: "la noche"
- tapOn: "el trabajo"
- tapOn: "el padre"
- tapOn: "la madre"
- tapOn: "el lugar"
- tapOn: "la hora"
- tapOn: "la familia"
- tapOn: "la historia"
- tapOn: "la mano"
- tapOn: "la cara"
- tapOn: "difícil"
- tapOn: "la sangre"
- tapOn: "comer"
- tapOn: "el marido"
- tapOn: "el cielo"
- tapOn: "el aire"
- tapOn: "la abuela"
- tapOn: "el alma"
- tapOn: "la tía"
- assertVisible: "20 SELECTED"
- runFlow: ../subflows/next-page.yaml
- assertVisible: "INTERMEDIATE WORDS"
- tapOn: "la prisión"
- tapOn: "el fondo"
- tapOn: "la trampa"
- tapOn: "el reloj"
- tapOn: "el cerdo"
- tapOn: "elegir"
- tapOn: "el pecho"
- tapOn: "el siglo"
- tapOn: "el espejo"
- tapOn: "la miel"
- tapOn: "fresco"
- tapOn: "el castigo"
- tapOn: "despertar"
- tapOn: "el equipaje"
- tapOn: "sano"
- tapOn: "el muelle"
- tapOn: "la queja"
- tapOn: "la campana"
- tapOn: "el salario"
- tapOn: "la nube"
- runFlow: ../subflows/next-page.yaml
- extendedWaitUntil:
    visible: "ADVANCED WORDS"
    timeout: 15000
- tapOn: "el brillo"
- tapOn: "la nieta"
- tapOn: "la ballena"
- tapOn: "el balcón"
- tapOn: "el vagón"
- tapOn: "el jardinero"
- tapOn: "el lema"
- tapOn: "el amuleto"
- tapOn: "mayormente"
- tapOn: "el manuscrito"
- tapOn: "la aspiradora"
- tapOn: "el candado"
- tapOn: "el ombligo"
- tapOn: "sujetar"
- tapOn: "halagador"
- tapOn: "el mechero"
- runFlow: ../subflows/next-page.yaml
- extendedWaitUntil:
    visible: "EXPERT WORDS"
    timeout: 15000
- tapOn: "el palillo"
- tapOn: "el sauce"
- tapOn: "el estornudo"
- tapOn: "el armisticio"
- tapOn: "encariñado"
- tapOn: "el regocijo"
- tapOn: "las tenazas"
- tapOn: "el salchichón"
- runFlow: ../subflows/next-page.yaml
- extendedWaitUntil:
    visible: "YOU ALREADY KNOW"
    timeout: 15000
- extendedWaitUntil:
    visible: "4,600"
    timeout: 5000
- assertVisible: "About level C1"
- tapOn: "Continue"
- assertVisible: "Why are you learning?"
- stopRecording
