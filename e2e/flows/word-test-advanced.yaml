# Word test, situation 3: an advanced learner. All four pages: 15+ advanced words open the EXPERT page.
# All of A and B, 16 of C, 8 of D → ≈ 4,600, C1 (checked with the engine). Needs the local stack: `npm run dev:up`.
appId: com.comebackhamid.lockwords
tags:
  - onboarding
---
- launchApp:
    clearState: true
    clearKeychain: true
- startRecording: word-test-advanced
# The steps live in a shared subflow (card-meaning.yaml uses them too).
- runFlow: ../subflows/advanced-to-goal.yaml
- assertVisible: "Why are you learning?"
- stopRecording
