name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lockwords_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lockwords_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit + component tests
        run: npm test
      - name: Server integration tests (real database)
        run: npm run test:integration
      - name: Vocabulary engine check (docs/vocab-engine.md 1.11, about 1 minute)
        run: npm run test:engine -w @lockwords/server
      # A phone-only import breaks the browser build; this catches it. Output is thrown away.
      - name: Web build (the app as a browser page)
        run: npx expo export -p web --output-dir /tmp/lockwords-web
        working-directory: apps/mobile
      - name: OpenSpec validate
        run: npx -y @fission-ai/openspec@1.14.2 validate --all --strict --no-interactive

  # The Android app must build. A debug build for one chip type (the emulator's) keeps it short.
  # android/ is generated (CNG), so the job makes it first. The APK is kept for 7 days to try on a phone or emulator.
  # No upload key here, so nothing in this job is signed for the Play Store (docs/android-release.md).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Make the Android project (expo prebuild)
        run: npx expo prebuild -p android --no-install
        working-directory: apps/mobile
      - uses: gradle/actions/setup-gradle@v4
      - name: Android debug build
        run: ./gradlew app:assembleDebug -x lint -x test -PreactNativeArchitectures=x86_64
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: lockwords-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid license for org repos, so run the free CLI.
      - name: gitleaks (secret scan, full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on high and critical advisories. Skips picomatch (see scripts/audit.mjs for why).
      - name: npm audit (high and critical)
        run: npm run audit
      - name: script tests (audit rule, docs pages)
        run: npm run test:scripts
