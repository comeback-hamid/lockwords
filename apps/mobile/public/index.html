<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The web app's own page (a copy of Expo's template plus the lines below). Expo fills the %...% marks. -->
    <meta name="description" content="Learn words in any language: your own decks made with Kai, fast swipe review, and practice in real sentences." />
    <!-- The browser's bars take the app's background color. -->
    <meta name="theme-color" content="#f6f8fa" />
    <!-- "Add to Home Screen" on a phone: the app's name and icon, opened without the browser's bars. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lockwords" />
    <meta property="og:title" content="Lockwords" />
    <meta property="og:description" content="Learn words in any language: your own decks made with Kai, fast swipe review, and practice in real sentences." />
    <meta property="og:type" content="website" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView>. The color is the app's canvas, so the
         page is never white before the app draws. */
      body {
        overflow: hidden;
        background-color: #f6f8fa;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
